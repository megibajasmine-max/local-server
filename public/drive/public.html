<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Public Files</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#000;
color:white;
padding:20px;
}

.header{
font-size:34px;
font-weight:bold;
margin-bottom:10px;
}

.sub{
color:#888;
margin-bottom:30px;
}

.nav{
display:flex;
gap:12px;
margin-bottom:25px;
}

.nav a{
flex:1;
padding:18px;
background:#111;
border-radius:18px;
text-decoration:none;
color:white;
text-align:center;
font-weight:bold;
}

.file{
background:#111;
padding:20px;
border-radius:24px;
margin-bottom:20px;
}

.file-name{
font-size:18px;
font-weight:bold;
margin-bottom:10px;
word-break:break-word;
}

img{
width:100%;
border-radius:20px;
margin-top:15px;
}

video{
width:100%;
border-radius:20px;
margin-top:15px;
}

audio{
width:100%;
margin-top:15px;
}

.open-btn{
display:block;
margin-top:15px;
padding:16px;
border-radius:18px;
background:white;
color:black;
text-decoration:none;
text-align:center;
font-weight:bold;
}

.share-btn{
width:100%;
margin-top:12px;
padding:16px;
border:none;
border-radius:18px;
background:#222;
color:white;
font-weight:bold;
}

</style>
</head>
<body>

<div class="header">
Public Files
</div>

<div class="sub">
Files Shared Publicly
</div>

<div class="nav">

<a href="index.html">
Upload
</a>

<a href="private.html">
Private
</a>

</div>

<div id="files"></div>

<script>

const API =
"https://local-server-1-0ht9.onrender.com";

async function loadFiles(){

const response =
await fetch(
`${API}/files`
);

const files =
await response.json();

const publicFiles =
files.filter(
file => file.type === 'public'
);

let html = '';

publicFiles.forEach(file=>{

html += `
<div class="file">

<div class="file-name">
${file.fileName}
</div>
`;

if(file.url.match(
/jpg|jpeg|png|gif|webp/i
)){

html += `
<img src="${file.url}">
`;

}

if(file.url.match(
/mp4|mov|webm/i
)){

html += `
<video controls>
<source src="${file.url}">
</video>
`;

}

if(file.url.match(
/mp3|wav|ogg/i
)){

html += `
<audio controls>
<source src="${file.url}">
</audio>
`;

}

html += `

<a class="open-btn"
href="${file.url}"
target="_blank">

Open File

</a>

<button class="share-btn"
onclick="shareFile('${file.url}')">

Share File

</button>

</div>
`;

});

document.getElementById(
'files'
).innerHTML = html;

}

async function shareFile(url){

if(navigator.share){

await navigator.share({

title:'SJT Drive',

text:'Shared using SJT Drive',

url:url

});

}else{

navigator.clipboard.writeText(
url
);

alert(
'Link Copied'
);

}

}

loadFiles();

</script>

</body>
</html>
