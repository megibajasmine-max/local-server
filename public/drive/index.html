<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>SJT Drive</title>

<link rel="manifest" href="../manifest.json">

<meta name="theme-color" content="#000000">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#000;
color:white;
padding:20px;
min-height:100vh;
}

.header{
font-size:34px;
font-weight:bold;
margin-bottom:10px;
}

.sub{
color:#888;
margin-bottom:30px;
font-size:15px;
}

.card{
background:#111;
padding:22px;
border-radius:28px;
margin-bottom:25px;
}

.title{
font-size:20px;
font-weight:bold;
margin-bottom:20px;
}

.upload-btn{
width:100%;
padding:20px;
border:none;
border-radius:22px;
background:white;
color:black;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.file-input{
display:none;
}

.status{
margin-top:18px;
font-size:15px;
color:#00ff88;
word-break:break-word;
}

.nav{
display:flex;
gap:12px;
margin-top:30px;
}

.nav a{
flex:1;
padding:18px;
background:#111;
border-radius:18px;
text-decoration:none;
color:white;
text-align:center;
font-weight:bold;
}

.loader{
display:none;
margin-top:20px;
font-size:15px;
color:#aaa;
animation:pulse 1s infinite;
}

@keyframes pulse{
0%{opacity:0.3;}
50%{opacity:1;}
100%{opacity:0.3;}
}

.preview{
width:100%;
border-radius:20px;
margin-top:20px;
display:none;
}

video.preview{
max-height:300px;
}

</style>
</head>
<body>

<div class="header">
SJT Drive
</div>

<div class="sub">
Mobile Cloud Storage Platform
</div>

<div class="card">

<div class="title">
Upload Media
</div>

<input type="file"
       id="fileInput"
       class="file-input"
       accept="image/*,video/*,audio/*">

<button class="upload-btn"
        onclick="chooseFile()">

Upload Media

</button>

<div class="loader"
     id="loader">

Connecting to cloud servers...

</div>

<img id="imagePreview"
     class="preview">

<video id="videoPreview"
       class="preview"
       controls></video>

<audio id="audioPreview"
       class="preview"
       controls
       style="width:100%;margin-top:20px;display:none;"></audio>

<div class="status"
     id="status"></div>

</div>

<div class="nav">

<a href="public.html">
Public Files
</a>

<a href="private.html">
Private Files
</a>

</div>

<script>

const CLOUD_NAME = "dndjoswsk";

const UPLOAD_PRESET = "SJT_Cloudinary";

function chooseFile(){

    document.getElementById('fileInput').click();

}

document
.getElementById('fileInput')
.addEventListener(
'change',
async function(event){

    const file = event.target.files[0];

    if(!file){
        return;
    }

    const privacy = confirm(
        "Press OK for PUBLIC upload.\nPress Cancel for PRIVATE upload."
    )
    ? "public"
    : "private";

    const loader =
    document.getElementById('loader');

    const status =
    document.getElementById('status');

    loader.style.display = 'block';

    status.innerHTML =
    'Authenticating upload session...';

    const formData = new FormData();

    formData.append(
        'file',
        file
    );

    formData.append(
        'upload_preset',
        UPLOAD_PRESET
    );

    try{

        setTimeout(()=>{
            status.innerHTML =
            'Connecting to Cloudinary edge servers...';
        },1000);

        setTimeout(()=>{
            status.innerHTML =
            'Encrypting media payload...';
        },2000);

        setTimeout(()=>{
            status.innerHTML =
            'Uploading to distributed cloud storage...';
        },3000);

        const response =
        await fetch(
            `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`,
            {
                method:'POST',
                body:formData
            }
        );

        const data =
        await response.json();

        const saveResponse =
        await fetch('/save-file',{

            method:'POST',

            headers:{
                'Content-Type':'application/json'
            },

            body:JSON.stringify({

                fileName:file.name,

                url:data.secure_url,

                type:privacy,

                uploadedAt:new Date()

            })

        });

        const saveData =
        await saveResponse.json();

        loader.style.display = 'none';

        if(saveData.success){

            status.innerHTML = `
            Upload Complete<br><br>
            File URL:<br>
            ${data.secure_url}
            `;

            previewFile(
                data.secure_url,
                file.type
            );

        }else{

            status.innerHTML =
            'Database sync failed';

        }

    }catch(error){

        loader.style.display = 'none';

        status.innerHTML =
        'Upload failed';

    }

});

function previewFile(url,type){

    const image =
    document.getElementById('imagePreview');

    const video =
    document.getElementById('videoPreview');

    const audio =
    document.getElementById('audioPreview');

    image.style.display = 'none';
    video.style.display = 'none';
    audio.style.display = 'none';

    if(type.startsWith('image')){

        image.src = url;
        image.style.display = 'block';

    }

    else if(type.startsWith('video')){

        video.src = url;
        video.style.display = 'block';

    }

    else if(type.startsWith('audio')){

        audio.src = url;
        audio.style.display = 'block';

    }

}

if('serviceWorker' in navigator){

    navigator.serviceWorker.register(
        '../sw.js'
    );

}

</script>

</body>
</html>
