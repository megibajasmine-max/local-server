<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SJT Drive Upload</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#0f172a;
color:white;
padding:20px;
}

h1{
font-size:35px;
margin-bottom:20px;
}

.top{
display:flex;
gap:10px;
margin-bottom:20px;
}

.top a{
flex:1;
text-decoration:none;
background:#1e293b;
padding:14px;
border-radius:15px;
text-align:center;
color:white;
}

.upload{
background:#111827;
padding:25px;
border-radius:25px;
}

input{
width:100%;
padding:15px;
background:#1e293b;
border:none;
border-radius:15px;
color:white;
margin-bottom:15px;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:15px;
background:#2563eb;
color:white;
font-size:16px;
}

#status{
margin-top:20px;
}

</style>

</head>

<body>

<h1>SJT Drive</h1>

<div class="top">

<a href="public.html">
Public
</a>

<a href="private.html">
Private
</a>

</div>

<div class="upload">

<input
type="file"
id="file">

<button onclick="uploadFile()">
Upload Media
</button>

<div id="status"></div>

</div>

<script>

if(
!localStorage.getItem(
'sjt_logged_in'
)
){
window.location.href = "/";
}

async function uploadFile(){

const file =
document.getElementById('file').files[0];

if(!file){
return;
}

const visibility =
confirm(
"Press OK for PUBLIC upload.\nPress Cancel for PRIVATE upload."
)
? "public"
: "private";

const formData =
new FormData();

formData.append(
'file',
file
);

formData.append(
'upload_preset',
'SJT_Cloudinary'
);

const status =
document.getElementById('status');

status.innerHTML =
"Uploading to secure cloud server...";

const response =
await fetch(
'https://api.cloudinary.com/v1_1/dndjoswsk/auto/upload',
{
method:'POST',
body: formData
}
);

const data =
await response.json();

const asset = {

url: data.secure_url,

type: file.type,

visibility

};

let items =
JSON.parse(
localStorage.getItem(
'sjt_assets'
)
) || [];

items.push(asset);

localStorage.setItem(
'sjt_assets',
JSON.stringify(items)
);

status.innerHTML = `

Upload Successful<br><br>

Cloud URL:<br>

<a href="${data.secure_url}"
target="_blank"
style="color:#60a5fa;">
${data.secure_url}
</a>

`;

}

</script>

</body>
</html>
