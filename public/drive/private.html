<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Private Files - SJT Drive</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#000;
color:white;
padding:20px;
min-height:100vh;
}

.header{
font-size:34px;
font-weight:bold;
margin-bottom:10px;
}

.sub{
color:#888;
margin-bottom:30px;
font-size:15px;
}

.nav{
display:flex;
gap:12px;
margin-bottom:25px;
}

.nav a{
flex:1;
padding:18px;
background:#111;
border-radius:18px;
text-decoration:none;
color:white;
text-align:center;
font-weight:bold;
}

.file{
background:#111;
padding:20px;
border-radius:25px;
margin-bottom:20px;
overflow:hidden;
}

.file-name{
font-size:18px;
font-weight:bold;
margin-bottom:12px;
word-break:break-word;
}

.file-date{
font-size:13px;
color:#888;
margin-bottom:18px;
}

.preview-image{
width:100%;
border-radius:20px;
margin-bottom:18px;
}

.preview-video{
width:100%;
border-radius:20px;
margin-bottom:18px;
max-height:350px;
}

.preview-audio{
width:100%;
margin-bottom:18px;
}

.private-badge{
display:inline-block;
padding:10px 16px;
background:#1f1f1f;
border-radius:14px;
font-size:13px;
font-weight:bold;
color:#00ff88;
margin-top:10px;
}

.empty{
text-align:center;
margin-top:80px;
font-size:18px;
color:#666;
}

.loading{
text-align:center;
margin-top:60px;
font-size:16px;
color:#999;
animation:pulse 1s infinite;
}

@keyframes pulse{
0%{opacity:0.3;}
50%{opacity:1;}
100%{opacity:0.3;}
}

</style>
</head>
<body>

<div class="header">
Private Files
</div>

<div class="sub">
Only Visible Inside Your Personal Drive
</div>

<div class="nav">

<a href="index.html">
Upload
</a>

<a href="public.html">
Public
</a>

</div>

<div id="filesContainer">

<div class="loading">
Connecting to encrypted private storage...
</div>

</div>

<script>

async function loadFiles(){

    try{

        const response =
        await fetch('/files');

        const files =
        await response.json();

        const privateFiles =
        files.filter(
            file => file.type === 'private'
        );

        const container =
        document.getElementById(
            'filesContainer'
        );

        if(privateFiles.length === 0){

            container.innerHTML = `
            <div class="empty">
            No Private Files Uploaded
            </div>
            `;

            return;

        }

        let html = '';

        privateFiles.forEach(file => {

            html += `
            <div class="file">

                <div class="file-name">
                ${file.fileName}
                </div>

                <div class="file-date">
                Uploaded:
                ${new Date(file.uploadedAt)
                    .toLocaleString()}
                </div>
            `;

            if(
                file.url.match(
                    /\.(jpg|jpeg|png|gif|webp)$/i
                )
            ){

                html += `
                <img
                src="${file.url}"
                class="preview-image">
                `;

            }

            else if(
                file.url.match(
                    /\.(mp4|webm|mov)$/i
                )
            ){

                html += `
                <video
                controls
                class="preview-video">

                <source
                src="${file.url}">

                </video>
                `;

            }

            else if(
                file.url.match(
                    /\.(mp3|wav|ogg)$/i
                )
            ){

                html += `
                <audio
                controls
                class="preview-audio">

                <source
                src="${file.url}">

                </audio>
                `;

            }

            html += `

            <div class="private-badge">
            Private Asset • Not Shareable
            </div>

            </div>
            `;

        });

        container.innerHTML = html;

    }catch(error){

        document.getElementById(
            'filesContainer'
        ).innerHTML = `
        <div class="empty">
        Failed To Connect To Private Storage
        </div>
        `;

    }

}

loadFiles();

</script>

</body>
</html>
