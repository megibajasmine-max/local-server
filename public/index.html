<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Public Files</title>

<style>

body{
margin:0;
padding:20px;
background:#000;
font-family:Arial;
color:white;
}

.header{
font-size:34px;
font-weight:bold;
margin-bottom:25px;
}

.file{
background:#111;
padding:20px;
border-radius:22px;
margin-bottom:20px;
overflow:hidden;
word-break:break-word;
}

.file-name{
font-size:18px;
font-weight:bold;
margin-bottom:15px;
}

.open-btn{
display:block;
width:100%;
padding:16px;
border-radius:16px;
background:white;
color:black;
text-decoration:none;
text-align:center;
font-weight:bold;
margin-top:15px;
box-sizing:border-box;
}

img{
width:100%;
border-radius:18px;
margin-top:15px;
}

video{
width:100%;
border-radius:18px;
margin-top:15px;
}

audio{
width:100%;
margin-top:15px;
}

.empty{
text-align:center;
margin-top:60px;
color:#888;
font-size:18px;
}

.top-nav{
display:flex;
gap:10px;
margin-bottom:25px;
}

.top-nav a{
flex:1;
padding:16px;
background:#111;
border-radius:16px;
text-decoration:none;
text-align:center;
color:white;
font-weight:bold;
}

</style>
</head>
<body>

<div class="header">
Public Files
</div>

<div class="top-nav">
<a href="index.html">Upload</a>
<a href="private.html">Private</a>
</div>

<div id="files"></div>

<script>

async function loadFiles(){

    const response = await fetch('/files');

    const files = await response.json();

    const publicFiles = files.filter(
        file => file.type === 'public'
    );

    let html = '';

    if(publicFiles.length === 0){

        html = `
        <div class="empty">
        No Public Files Uploaded
        </div>
        `;

    }

    publicFiles.forEach(file => {

        html += `
        <div class="file">

            <div class="file-name">
            ${file.fileName}
            </div>
        `;

        if(file.url.match(/jpg|jpeg|png|gif|webp/i)){

            html += `
            <img src="${file.url}">
            `;

        }

        if(file.url.match(/mp4|mov|webm/i)){

            html += `
            <video controls>
                <source src="${file.url}">
            </video>
            `;

        }

        if(file.url.match(/mp3|wav|ogg/i)){

            html += `
            <audio controls>
                <source src="${file.url}">
            </audio>
            `;

        }

        html += `
            <a class="open-btn"
               href="${file.url}"
               target="_blank">

               Open File

            </a>

        </div>
        `;

    });

    document.getElementById('files').innerHTML = html;

}

loadFiles();

</script>

</body>
</html>
